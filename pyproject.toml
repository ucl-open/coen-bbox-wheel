[build-system]
requires = ["uv_build>=0.8.22"]
build-backend = "uv_build"

[project]
name = "ucl-open-coen-behaviour-box"
description = "A library that defines an open-rigs data schema for the coen-behaviour-box experiment."
authors = [ {name = "Pip Coen", email = "pipcoen@gmail.com"}]
license = "BSD-3-Clause"
requires-python = ">=3.11, <3.12"
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Operating System :: Microsoft :: Windows",
]
version = "0.0.0-rc1"
readme = {file = "README.md", content-type = "text/markdown"}

dependencies = [
  "swc-aeon>=0.2.0",
  "open-rigs",
]

[tool.ruff]
line-length = 120
target-version = 'py311'

[tool.ruff.lint]
extend-select = ['Q', 'RUF100', 'C90', 'I']
extend-ignore = []
mccabe = { max-complexity = 14 }
pydocstyle = { convention = 'google' }

[tool.codespell]
skip = '.git,*.pdf,*.svg,./bonsai,*.bonsai,./docs/_build,uv.lock,*Generated.cs'
ignore-words-list = 'nd'

[tool.uv]
required-version = '>=0.8.4'

[tool.uv.sources]
open-rigs = {git = "https://github.com/Coen-Lab/lib-open-rigs", rev = "6fe2c41ece60a041dc0c714ef4d5699b8e0816a6"}
swc-aeon = { git = "https://github.com/SainsburyWellcomeCentre/aeon_api.git", rev = "7cd561d382011b9fbdcafe827cd92a2804b6799f" }

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
